name: Android development build
on:
  push:
    branches: [main, integration/unified-aegis]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner Android SDK is unavailable}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          java -version
          "$SDKMANAGER" --version
      - name: Install only declared SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' </dev/null
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Build debug APK
        working-directory: apps/android
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
      - name: Run JVM tests
        working-directory: apps/android
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Run Android lint
        working-directory: apps/android
        run: gradle --no-daemon --console=plain --stacktrace :app:lintDebug
      - name: Verify UDP lab APK integrity signature and version
        working-directory: apps/android
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APK="$PWD/app/build/outputs/apk/debug/app-debug.apk"
          REPORT_DIR="$PWD/app/build/reports/apk-validation"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$REPORT_DIR"
          REPORT="$REPORT_DIR/apk-validation.txt"
          printf 'Source head: %s\nCheckout commit: %s\nRun ID: %s\nRun attempt: %s\n' "$SOURCE_HEAD" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee "$REPORT"
          test -s "$APK"
          stat --printf='APK size: %s bytes\n' "$APK" | tee -a "$REPORT"
          unzip -t "$APK" 2>&1 | tee -a "$REPORT"
          test -x "$TOOLS/apksigner"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee -a "$REPORT"
          test -x "$TOOLS/aapt"
          "$TOOLS/aapt" dump badging "$APK" | tee "$REPORT_DIR/badging.txt" | tee -a "$REPORT"
          grep -F "package: name='com.aegismirror.app' versionCode='4' versionName='0.4.0-udp-lab'" "$REPORT_DIR/badging.txt" | tee -a "$REPORT"
          (cd "$(dirname "$APK")"; sha256sum app-debug.apk) | tee "$APK.sha256" | tee -a "$REPORT"
          printf '\nPASS: archive, APK signature and expected lab metadata verified.\nThis does not prove installed-key compatibility, device behavior or VPN protection.\n' | tee -a "$REPORT"
          {
            printf '## UDP lab APK verification\n\n```text\n'
            cat "$REPORT"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified development APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload available diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
