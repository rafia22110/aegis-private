name: Unified Aegis verification
on:
  push:
    branches: [integration/unified-aegis]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG decoder
        run: python -m pip install Pillow==11.3.0
      - name: Storage tests
        run: python -m unittest discover -s tests/storage -p 'test_*.py' -v
      - name: Web tests
        run: python -m unittest discover -s tests/web -p 'test_*.py' -v
      - name: Offline policy tests
        run: python -m unittest discover -s tests/engine -p 'test_*.py' -v
      - name: Build actual site and decode copied PNG files
        run: python scripts/verify_web_build.py
