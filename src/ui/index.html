              { name: 'Messenger', pkg: 'com.facebook.orca', icon: 'forum', permissions: [ { name: 'Microphone', active: true }, { name: 'Contacts', active: true } ] },
              { name: 'Instagram', pkg: 'com.instagram.android', icon: 'photo_camera', permissions: [ { name: 'Storage', active: true }, { name: 'Location', active: true } ] }
          ],

          initLanguage() {
              if (navigator.language && navigator.language.startsWith('he')) {
                  this.language = 'he';
              } else {
                  this.language = 'en';
              }
          },

          applyProtectionLevel(level) {
              this.protectionLevel = level;
              if (level === 'strict') {
                  this.apps.forEach(app => {
                      app.permissions.forEach(p => {
                          if (p.name.includes('Location') || p.name.includes('GPS')) {
                              p.active = false;
                          }
                      });
                  });
              } else if (level === 'paranoid') {
                  this.apps.forEach(app => {
                      app.permissions.forEach(p => {
                          p.active = false;
                      });
                  });
              } else {
                  this.apps[0].permissions[0].active = true;
                  this.apps[0].permissions[1].active = false;
                  this.apps[1].permissions[0].active = true;
                  this.apps[2].permissions[0].active = true;
              }

              this.paymentStatus = 'processing';
              setTimeout(() => {
                  this.paymentStatus = 'completed';

                        <!-- Product Pitch card -->
                        <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-100 space-y-1">
                            <p class="text-[10px] font-bold text-slate-800" x-text="t('mobPitchTitle')"></p>
                            <p class="text-[9px] text-slate-500 leading-relaxed" x-text="t('mobPitchDesc')"></p>
                        </div>

                        <!-- Terms of service confirmation checkbox -->
                        <div class="p-2.5 bg-amber-50/50 rounded-xl border border-amber-100/50">
                            <label class="flex items-start gap-2 cursor-pointer select-none">
                                <input type="checkbox" x-model="acceptedTerms" class="w-4 h-4 rounded border-amber-300 text-amber-500 focus:ring-amber-400/50 mt-0.5 cursor-pointer">
                                <span class="text-[9px] text-slate-700 leading-relaxed font-medium" x-text="t('mobCheckbox')"></span>
                            </label>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-100">
                        <button @click="activeView = 'mobile_payment'"
                                :disabled="!acceptedTerms"
                                :class="acceptedTerms ? 'bg-amber-500 hover:bg-amber-400 text-white cursor-pointer shadow-md' : 'bg-slate-100 text-slate-400 cursor-not-allowed'"
                                class="w-full py-2.5 rounded-lg text-[10px] font-bold transition duration-150 flex items-center justify-center gap-1.5">
                            <span x-text="t('mobButtonConnect')"></span>
                            <span class="material-symbols-outlined text-xs">arrow_forward</span>
                        </button>
                    </div>
                </div>

                <!-- VIEW 2: ONE-TAP SUBSCRIPTION PAYMENT -->
                <div x-show="activeView === 'mobile_payment'" class="flex-grow flex flex-col justify-between" x-cloak x-transition>
                    <div class="flex-grow overflow-y-auto space-y-4 px-0.5 text-left">
                        <div class="text-center space-y-1">
                            <span class="material-symbols-outlined text-2xl text-emerald-500">lock_open</span>
                            <h2 class="heading-font text-sm font-extrabold text-slate-900" x-text="t('mobPaymentTitle')"></h2>
                            <p class="text-[10px] text-slate-500" x-text="t('mobPaymentDesc')"></p>
                        </div>

                        <!-- Active promo billing tier -->
                        <div class="bg-gradient-to-br from-amber-50 to-amber-100/30 border border-amber-200 p-3.5 rounded-xl relative shadow-sm text-left">
                            <div class="absolute top-2 right-2 bg-amber-500 text-white text-[7px] font-extrabold px-1.5 py-0.5 rounded-full uppercase tracking-wider" x-text="t('mobActiveChoice')"></div>
                            <p class="text-[10px] font-bold text-amber-800" x-text="t('mobSovereignPlan')"></p>

                            <div class="my-1.5 flex items-baseline gap-0.5">
                                <span class="text-2xl font-black text-slate-900">$10</span>
                                <span class="text-[9px] text-slate-400 font-semibold">/ lifetime</span>
                            </div>

                            <div class="border-t border-amber-200/50 pt-2 mt-2 space-y-1 text-[9px] text-slate-700 font-medium">
                                <p class="flex items-center gap-1">
                                    <span class="w-1 h-1 rounded-full bg-emerald-500"></span>
                                    <span x-text="t('refundPolicyText1')"></span>
                                </p>
                                <p class="flex items-center gap-1">
                                    <span class="w-1 h-1 rounded-full bg-emerald-500"></span>
                                    <span x-text="t('refundPolicyText2')"></span>
                                </p>
                            </div>
                        </div>

                        <!-- Card details container -->
                        <div class="space-y-2">
                            <p class="text-[8px] font-bold uppercase tracking-wider text-slate-400" x-text="t('mobCardSubtitle')"></p>
                            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 space-y-2">
                                <div>
                                    <label class="block text-[8px] font-bold text-slate-400 uppercase mb-0.5" x-text="t('mobCardholder')"></label>
                                    <input type="text" value="Aegis Sovereign Participant" readonly class="w-full bg-white px-2 py-1 border border-slate-200 rounded text-[9px] font-medium text-slate-700">
                                </div>
                                <div class="grid grid-cols-3 gap-1">
                                    <div class="col-span-2">
                                        <label class="block text-[8px] font-bold text-slate-400 uppercase mb-0.5" x-text="t('mobCardNum')"></label>
                                        <input type="text" value="4580 1200 4500 9012" readonly class="w-full bg-white px-2 py-1 border border-slate-200 rounded text-[9px] font-mono text-slate-700">
                                    </div>
                                    <div>
                                        <label class="block text-[8px] font-bold text-slate-400 uppercase mb-0.5">CVV</label>
                                        <input type="text" value="777" readonly class="w-full bg-white px-2 py-1 border border-slate-200 rounded text-[9px] font-mono text-center text-slate-700">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-100">
                        <button @click="checkout(); setTimeout(() => activeView = 'mobile_takeover', 1600)"
                                :disabled="paymentStatus === 'processing'"
                                class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-[10px] rounded-lg shadow-sm transition duration-150 cursor-pointer flex items-center justify-center gap-1">
                            <span class="material-symbols-outlined text-xs">payment</span>
                            <span x-text="paymentStatus === 'processing' ? t('mobButtonProcessing') : (paymentStatus === 'completed' ? t('mobButtonSuccess') : t('mobButtonPay'))"></span>
                        </button>
                    </div>
                </div>

                <!-- VIEW 3: GRANULAR APPLICATION PERMISSIONS BOARD -->
                <div x-show="activeView === 'mobile_takeover'" class="flex-grow flex flex-col justify-between" x-cloak x-transition>
                    <div class="flex-grow overflow-y-auto space-y-4 px-0.5 text-left">
                        <div class="text-center space-y-1">
                            <span class="material-symbols-outlined text-xl text-amber-500 animate-spin">sync</span>
                            <h2 class="heading-font text-xs font-extrabold text-slate-900" x-text="t('mobShieldActiveTitle')"></h2>
                            <p class="text-[9px] text-slate-500" x-text="t('mobShieldActiveDesc')"></p>
                        </div>

                        <!-- Protection Level selector switches -->
                        <div class="space-y-1.5">
                            <p class="text-[8px] font-bold uppercase tracking-wider text-slate-400" x-text="t('mobProtLevel')"></p>
                            <div class="grid grid-cols-3 gap-1 bg-slate-100 p-0.5 rounded-lg">
                                <button @click="applyProtectionLevel('balanced')"
                                        :class="protectionLevel === 'balanced' ? 'bg-white text-amber-600 font-bold shadow-sm' : 'text-slate-500'"
                                        class="py-1 rounded text-[8px] transition text-center cursor-pointer">
                                    Balanced
                                </button>
                                <button @click="applyProtectionLevel('strict')"
                                        :class="protectionLevel === 'strict' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500'"
                                        class="py-1 rounded text-[8px] transition text-center cursor-pointer">
                                    Strict GPS
                                </button>
                                <button @click="applyProtectionLevel('paranoid')"
                                        :class="protectionLevel === 'paranoid' ? 'bg-white text-rose-600 font-bold shadow-sm' : 'text-slate-500'"
                                        class="py-1 rounded text-[8px] transition text-center cursor-pointer">
                                    Lockdown
                                </button>
                            </div>
                        </div>

                        <!-- App permission list controls -->
                        <div class="space-y-1.5">
                            <p class="text-[8px] font-bold uppercase tracking-wider text-slate-400" x-text="t('mobAppPermissions')"></p>
                            <div class="space-y-1.5 max-h-[160px] overflow-y-auto pr-0.5">
                                <template x-for="app in apps" :key="app.pkg">
                                    <div class="p-2 rounded-lg border border-slate-100 bg-slate-50 space-y-1">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-xs text-amber-500" x-text="app.icon"></span>
                                                <span class="text-[9px] font-bold text-slate-800" x-text="app.name"></span>
                                            </div>
                                            <span class="text-[7px] font-mono text-slate-400" x-text="app.pkg"></span>
                                        </div>
                                        <div class="flex flex-wrap gap-1">
                                            <template x-for="perm in app.permissions">
                                                <button @click="perm.active = !perm.active"
                                                        :class="perm.active ? 'bg-emerald-500/10 text-emerald-700 border-emerald-500/20' : 'bg-rose-500/10 text-rose-700 border-rose-500/20'"
                                                        class="px-1.5 py-0.5 rounded text-[8px] font-medium border transition cursor-pointer flex items-center gap-0.5">
                                                    <span class="w-0.5 h-0.5 rounded-full" :class="perm.active ? 'bg-emerald-500' : 'bg-rose-500'"></span>
                                                    <span x-text="perm.name"></span>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-100">
                        <button @click="activeView = 'mobile_dashboard'"
                                class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-white font-bold text-[10px] rounded-lg shadow-sm transition duration-150 cursor-pointer flex items-center justify-center gap-1">
                            <span class="material-symbols-outlined text-xs">check_circle</span>
                            <span x-text="t('mobDeployButton')"></span>
                        </button>
                    </div>
                </div>

                <!-- VIEW 4: ACTIVE SECURED WALLPAPER DASHBOARD -->
                <div x-show="activeView === 'mobile_dashboard'" class="flex-grow flex flex-col justify-between" x-cloak x-transition>
                    <div class="flex-grow flex flex-col items-center justify-center space-y-4">
                        <div class="w-16 h-16 bg-white/90 rounded-2xl border border-amber-200 shadow-lg flex items-center justify-center animate-glowing-core">
                            <img src="Logo.png" class="w-10 h-10 object-contain" />
                        </div>
                        <div class="text-center space-y-0.5 bg-white/80 px-3 py-1.5 rounded-xl border border-white/50">
                            <h2 class="heading-font text-[11px] font-extrabold text-slate-900" x-text="t('mobSecuredTitle')"></h2>
                            <p class="text-[8px] font-bold text-emerald-600 uppercase tracking-wider flex items-center justify-center gap-0.5">
                                <span class="w-1 h-1 rounded-full bg-emerald-500 animate-ping"></span>
                                <span x-text="t('mobTerminalSecured')"></span>
                            </p>
                        </div>
                    </div>

                    <!-- Interactive control dashboard utilities -->
                    <div class="space-y-2 bg-white/90 p-2.5 rounded-2xl border border-white/90 shadow-md">
                        <p class="text-[8px] font-bold uppercase tracking-wider text-slate-400 text-center" x-text="t('mobInteractiveControl')"></p>
                        <div class="grid grid-cols-2 gap-1.5 text-left">
                            <button @click="alert(t('mobAlertWatchdog'))"
                                    class="p-2 rounded-lg border border-slate-100 bg-slate-50 hover:bg-slate-100 transition text-left cursor-pointer">
                                <span class="material-symbols-outlined text-amber-500 text-xs">settings_suggest</span>
                                <p class="text-[8px] font-bold text-slate-800 mt-0.5" x-text="t('mobWatchdog')"></p>
                            </button>
                            <button @click="alert(t('mobAlertTelemetry'))"
                                    class="p-2 rounded-lg border border-slate-100 bg-slate-50 hover:bg-slate-100 transition text-left cursor-pointer">
                                <span class="material-symbols-outlined text-emerald-500 text-xs">bar_chart</span>
                                <p class="text-[8px] font-bold text-slate-800 mt-0.5" x-text="t('mobTraffic')"></p>
                            </button>
                        </div>
                        <button @click="activeView = 'gateway'"
                                class="w-full py-2 bg-slate-900 hover:bg-slate-850 text-white font-bold text-[9px] rounded-lg transition cursor-pointer"
                                x-text="t('mobBackToDesktop')">
                        </button>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <!-- Footer with simple friendly branding links -->
    <footer class="border-t border-slate-200/60 bg-white/80 backdrop-blur-md py-6 text-center mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-[10px] text-slate-400 font-mono tracking-wider">
            AEGIS MIRROR SHIELD ENGINE PROTOCOL V0.40.0 • ILLUMINATED SECURE NETWORKS
        </div>
    </footer>

</body>
</html>
